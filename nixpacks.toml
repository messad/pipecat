# nixpacks.toml
providers = ["python"]

[phases.setup]
nixPkgs = ['python311', 'gcc']  # gcc bazı deps için gerekebilir

[phases.install]
cmds = [
  "python -m venv /opt/venv",
  ". /opt/venv/bin/activate",
  "pip install --upgrade pip setuptools wheel",
  "pip install -e .[all]"  # veya extras'larını yaz: pip install "pipecat-ai[deepgram,groq,elevenlabs,etc]"
]

[start]
cmd = "python your_bot_file.py"  # bot dosyanı değiştir, uvicorn varsa: "uvicorn bot:app --host 0.0.0.0 --port 7860"
